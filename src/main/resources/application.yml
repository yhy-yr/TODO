# ===== Spring Boot 配置文件 =====
# YAML 格式靠"缩进"表示层级关系，必须用空格，绝对不能用 Tab，否则启动直接报错。
# 同一个配置项的完整路径 = 各级 key 用点连起来，比如 spring.datasource.url。

spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s
  # datasource：数据源配置，也就是"应用要连哪个数据库、用什么账号连"。
  # 因为 pom 里引入了 spring-boot-starter-data-jpa 和 mysql-connector-j，
  # Spring Boot 会自动配置一个 HikariCP 连接池，下面这几项就是在给它填参数。
  datasource:

    url: jdbc:mysql://localhost:3306/todo_db?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: "200626"

  flyway:
    enabled: true

    # 当前数据库已经存在 todo 表。
    # 第一次启用 Flyway 时，将现有结构登记为版本 1，
    # 避免再次执行 V1 建表脚本。
    baseline-on-migrate: false
    baseline-version: 1
  jpa:
    # show-sql 和下面的 properties 是【平级】的，都属于 jpa 的直接子项，缩进必须对齐（都是 4 个空格）。
    # YAML 的铁律：一个 key 后面要么跟值，要么跟缩进的子节点，不能两者都有。
    #   show-sql: true        → true 是它的值，到此结束
    #   properties:           → 值是下面缩进的子节点
    show-sql: true          # 控制台打印 Hibernate 实际执行的 SQL
    properties:
      hibernate:
        format_sql: true    # 打印出来的 SQL 带缩进格式化，更容易读
    hibernate:
      # ddl-auto 控制"应用启动时，要不要根据实体类自动改数据库表结构"。可选值：
      #   none    什么都不做（生产环境推荐，配合 Flyway/Liquibase 手动管理表结构）
      #   validate 只校验实体类和表结构是否一致，不一致就启动失败，不改任何东西
      #   update   有变化就更新表：新增字段/表会自动加，但【不会删除】已有的列
      #   create   每次启动先删表再重建 —— 数据会全部丢失，只能用于临时测试
      #   create-drop 启动时建表，应用关闭时删表 —— 数据同样留不下来
      #
      # 你现在用的是 update，开发期很方便。但要注意它的坑：
      # 改了字段名（比如 title 改成 name），它只会加一个 name 列，旧的 title 列会一直留着，
      # 时间长了表里会堆积没用的垃圾字段。
      ddl-auto: validate
    # 想看 SQL 里 ? 占位符实际绑定的值，再加这段日志配置：
    # logging:
    #   level:
    #     org.hibernate.orm.jdbc.bind: TRACE

server:
  # 内置 Tomcat 监听的端口。
  # 遇到 "Port 8080 was already in use" 说明端口被别的程序占了，改这里或者关掉占用进程即可。
  port: 8080
  shutdown: graceful
  # servlet:
  #   context-path: /api    # 如果打开这行，所有接口都会加上 /api 前缀，
                            # 那么访问地址就变成 http://localhost:8080/api/todo
                            # 这也是很多人遇到 404 的原因之一：改了前缀却还用旧地址访问
